# Laravel public-root vhost. Render/any PaaS can reach Apache via ${PORT}.
<VirtualHost *:${PORT}>
    ServerAdmin admin@aishibeauty.com
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Respect X-Forwarded-* headers so Laravel builds correct absolute URLs.
    SetEnvIfNoCase X-Forwarded-Proto "https" HTTPS=on

    ErrorLog  ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
