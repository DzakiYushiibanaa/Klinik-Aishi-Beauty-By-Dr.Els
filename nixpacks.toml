# Nixpacks build config untuk Railway (Laravel 12 + Filament 4)
# Docs: https://nixpacks.com/docs/configuration/file
#
# Target PHP 8.3 dengan ekstensi: intl, gd, zip, bcmath, sockets, exif,
# mbstring, pdo_mysql, dan dependencies lain yang dibutuhkan Filament,
# PhpSpreadsheet, DomPDF, Mike42 escpos.

providers = ["php", "node"]

[phases.setup]
# Override daftar paket nix. Tambahkan PHP 8.3 + ekstensinya + composer + node.
nixPkgs = [
    "php83",
    "php83Extensions.intl",
    "php83Extensions.gd",
    "php83Extensions.zip",
    "php83Extensions.bcmath",
    "php83Extensions.sockets",
    "php83Extensions.exif",
    "php83Extensions.mbstring",
    "php83Extensions.pdo",
    "php83Extensions.pdo_mysql",
    "php83Extensions.mysqli",
    "php83Extensions.opcache",
    "php83Extensions.openssl",
    "php83Extensions.tokenizer",
    "php83Extensions.xml",
    "php83Extensions.fileinfo",
    "php83Extensions.ctype",
    "php83Extensions.dom",
    "php83Extensions.curl",
    "php83Extensions.filter",
    "php83Extensions.session",
    "php83Extensions.simplexml",
    "php83Packages.composer",
    "nodejs_20",
]

[phases.install]
# Override command composer/npm default Nixpacks supaya pakai PHP 8.3 dari
# setup phase dan skip dev deps.
cmds = [
    "php --version",
    "composer install --no-dev --no-interaction --no-progress --prefer-dist --optimize-autoloader",
    "npm ci --no-audit --no-fund",
]

[phases.build]
cmds = [
    "npm run build",
]

[start]
# Jalankan migration + storage:link + cache warm-up, lalu PHP built-in server
# listen di $PORT (Railway inject otomatis).
cmd = "php artisan migrate --force --no-interaction && php artisan storage:link || true && php artisan config:cache && php artisan route:cache && php artisan view:cache && php -S 0.0.0.0:${PORT:-8080} -t public"

[variables]
APP_ENV = "production"
LOG_CHANNEL = "stack"
NIXPACKS_PHP_ROOT_DIR = "/app/public"
