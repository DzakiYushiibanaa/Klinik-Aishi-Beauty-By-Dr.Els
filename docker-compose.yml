# Local helper untuk test Dockerfile end-to-end sebelum deploy.
# Jalankan:  docker compose up --build
# Buka:      http://localhost:10000

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: aishi-beauty:latest
    ports:
      - "10000:10000"
    environment:
      APP_NAME: "Klinik Aishi Beauty (Local Docker)"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:10000
      APP_KEY: "base64:zFieazjKAEHyHmeR+hbhVl4Zmuwq6ejQaBzHpLDmPac="          # entrypoint akan generate pada boot pertama

      LOG_CHANNEL: stack
      LOG_LEVEL: debug

      # ── MySQL ─────────────────────────────────────────────
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: aishi
      DB_USERNAME: aishi
      DB_PASSWORD: aishi_secret

      CACHE_STORE: database
      QUEUE_CONNECTION: database
      SESSION_DRIVER: database
      SESSION_LIFETIME: "120"

      FILESYSTEM_DISK: public

      MAIL_MAILER: log

      RUN_MIGRATIONS: "true"
      RUN_SEED: "false"

      PORT: "10000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app_storage:/var/www/html/storage/app

  db:
    image: mysql:8.0
    restart: unless-stopped
    command:
      - --default-authentication-plugin=caching_sha2_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: aishi
      MYSQL_USER: aishi
      MYSQL_PASSWORD: aishi_secret
      MYSQL_ROOT_PASSWORD: root_secret
    ports:
      - "33061:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uaishi", "-paishi_secret"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  app_storage:
  db_data:
