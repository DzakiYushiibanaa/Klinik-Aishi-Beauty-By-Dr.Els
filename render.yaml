# Render Blueprint — Klinik Aishi Beauty (MySQL setup)
# Docs: https://render.com/docs/blueprint-spec
#
# Catatan penting:
# Render tidak menyediakan managed MySQL, hanya PostgreSQL. Jadi untuk MySQL
# Anda perlu pakai provider eksternal (gratisan/murah yang direkomendasikan):
#
#   - Aiven MySQL          (free 1 bulan trial, lanjut paid)
#   - Clever Cloud MySQL   (free tier 256MB RAM)
#   - PlanetScale          (Hobby tier, gratis, MySQL compatible)
#   - Railway MySQL        (trial credit bulanan)
#   - Niagahoster / domain lokal — shared hosting MySQL
#
# Isi DB_HOST, DB_DATABASE, DB_USERNAME, DB_PASSWORD di dashboard Render
# setelah service dibuat.

services:
  - type: web
    name: aishi-beauty
    runtime: docker
    plan: free             # upgrade ke starter ($7) untuk production serius
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    autoDeploy: true

    disk:
      name: aishi-storage
      mountPath: /var/www/html/storage/app
      sizeGB: 1

    envVars:
      # ── Laravel core ──────────────────────────────────────
      - key: APP_NAME
        value: "Klinik Aishi Beauty"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        sync: false        # set ke URL Render Anda (https://xxx.onrender.com)
      - key: APP_KEY
        generateValue: true

      - key: LOG_CHANNEL
        value: stack
      - key: LOG_LEVEL
        value: warning

      # ── MySQL (external) ──────────────────────────────────
      # Isi semua nilai ini lewat dashboard Render setelah service running.
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false

      # ── Cache / session / queue ───────────────────────────
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_LIFETIME
        value: "120"

      # ── Filesystem ────────────────────────────────────────
      - key: FILESYSTEM_DISK
        value: public

      # ── Mail ──────────────────────────────────────────────
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: MAIL_FROM_NAME
        value: "Aishi Beauty"

      # ── Midtrans ──────────────────────────────────────────
      - key: MIDTRANS_SERVER_KEY
        sync: false
      - key: MIDTRANS_CLIENT_KEY
        sync: false
      - key: MIDTRANS_IS_PRODUCTION
        value: "false"

      # ── Entrypoint behaviour ──────────────────────────────
      - key: RUN_MIGRATIONS
        value: "true"
      - key: RUN_SEED
        value: "false"
