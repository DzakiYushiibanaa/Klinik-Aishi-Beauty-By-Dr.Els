# Force Railway untuk pakai Dockerfile, bukan Nixpacks (yang buggy untuk
# Laravel + Vite stack).

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Laravel healthcheck endpoint (built-in sejak Laravel 11)
healthcheckPath = "/up"
healthcheckTimeout = 300

# Restart kalau crash
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

numReplicas = 1
