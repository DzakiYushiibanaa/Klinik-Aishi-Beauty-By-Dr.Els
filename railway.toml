# Railway config untuk Klinik Aishi Beauty
# Docs: https://docs.railway.com/reference/config-as-code
#
# File ini cukup simple karena Railway bisa auto-detect Dockerfile.
# Logic deploy (migrate, cache, storage:link) sudah ada di docker/entrypoint.sh.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Health check — pastikan service benar-benar siap sebelum traffic masuk
healthcheckPath = "/"
healthcheckTimeout = 120

# Restart kalau container crash
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# Jumlah replika — free tier 1, scale-up saat production
numReplicas = 1
